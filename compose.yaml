services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
