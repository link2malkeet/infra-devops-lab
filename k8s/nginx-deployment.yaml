apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: infra-devops-lab
  labels:
    app: infra-devops-lab
    component: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-devops-lab
      component: nginx
  template:
    metadata:
      labels:
        app: infra-devops-lab
        component: nginx
    spec:
      containers:
      - name: nginx
        image: infra-devops-lab-nginx:latest
        imagePullPolicy: Never  # Use local image for Minikube/Kind
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
