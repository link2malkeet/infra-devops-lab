apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: infra-devops-lab
  labels:
    app: infra-devops-lab
    component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infra-devops-lab
      component: app
  template:
    metadata:
      labels:
        app: infra-devops-lab
        component: app
    spec:
      containers:
      - name: app
        image: infra-devops-lab-app:latest
        imagePullPolicy: Never  # Use local image for Minikube/Kind
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
