apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: infra-devops-lab
  labels:
    app: infra-devops-lab
    component: nginx
spec:
  type: NodePort  # For local access
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080  # Access via localhost:30080
    protocol: TCP
    name: http
  selector:
    app: infra-devops-lab
    component: nginx
